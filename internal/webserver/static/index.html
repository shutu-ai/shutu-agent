<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数驼 AI Agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/png" href="/static/big_logo_1.png">
</head>
<body>
  <!-- Login view (public shell): only shown when the backend actually answers
       401 (a web_server.token is configured). The token never leaves the
       Authorization header (ADR D-WEB2-B / D-WEB2-G). -->
  <div id="login" class="login hidden">
    <form class="login-card" id="login-form">
      <h1>数驼 AI Agent</h1>
      <p class="muted">输入 web_server.token 进入工作台（令牌只存本机浏览器）</p>
      <p id="login-msg" class="err hidden"></p>
      <input type="password" id="tok" placeholder="Bearer token" autocomplete="current-password">
      <button type="submit">进入</button>
    </form>
  </div>

  <!-- dsh-style three-column workspace (ADR D-WEB2-F / D-WEB2-I): the frame is
       grid( sidebar | center | details ); the sidebar collapses to a 56px rail
       below 1024px; details stays mounted at 0 width. -->
  <div id="workspace" class="workspace hidden">
    <div id="frame" class="frame" data-sidebar-collapsed="false" data-details-collapsed="true">
      <!-- Sidebar column (dsh ui-sidebar shell: logoRow → New Session bar →
           section header → session list → foot). -->
      <section class="col-sidebar" aria-label="会话侧栏">
        <!-- Brand row (dsh SidebarRoot logoRow, 60px): the brand button is a
             New-Session shortcut; the panel toggle folds to the 56px rail. -->
        <div class="logo-row">
          <button id="brand" class="brand" title="新建会话" type="button">
            <span class="brand-mark" aria-hidden="true">
              <img id="brand-logo" alt="" width="24" height="24" src="/static/big_logo_1.png">
            </span>
            <span class="brand-name">数驼 AI&nbsp;<em class="brand-agent">AGENT</em></span>
          </button>
          <button id="sidebar-toggle" class="icon-button" title="折叠侧栏" type="button">
            <!-- dsh rail behavior: resting rail shows the brand mark; hovering
                 swaps in the panel (expand) icon; expanded always shows it. -->
            <span class="toggle-mark" aria-hidden="true">
              <img id="toggle-logo" alt="" width="24" height="24" src="/static/big_logo_1.png">
            </span>
            <span class="toggle-panel" data-icon="panelleft" aria-hidden="true"></span>
          </button>
        </div>

        <!-- New Session bar (dsh 38px elevated bar; rail keeps the icon). -->
        <button id="new-session" class="new-session-bar" title="新建会话" type="button">
          <span class="ns-ico" data-icon="newchat" aria-hidden="true"></span>
          <span class="ns-label">新会话</span>
        </button>

        <!-- Section header (dsh WorkspaceBrowser sectionHeader): a label that
             reads 工作区 in grouped views and 会话 in the flat list, plus a
             search icon, the view options (dsh ViewOptionsMenu: group + order)
             and an add-workspace control that opens a folder picker. -->
        <div class="ws-header">
          <span class="ws-label" id="ws-label">工作区</span>
          <div class="ws-search" id="ws-search">
            <button id="search-toggle" class="icon-button ws-search-btn" data-icon="search" title="搜索会话" type="button"></button>
            <input id="session-search" type="text" placeholder="搜索会话…" autocomplete="off"
                   spellcheck="false" tabindex="-1" aria-label="搜索会话">
            <button id="search-clear" class="ws-clear" data-icon="close" title="清除" type="button" tabindex="-1" hidden></button>
          </div>
          <button id="view-toggle" class="icon-button ws-header-btn" data-icon="personalization" title="视图选项" type="button"></button>
          <button id="ws-add" class="icon-button ws-header-btn" data-icon="projectadd" title="新建工作区" type="button"></button>
        </div>
        <!-- View-options popover (dsh ViewOptionsMenu): group mode + sort mode. -->
        <div id="view-menu" class="si-pop ws-view-menu hidden">
          <div class="wm-title">分组方式</div>
          <button data-view="workspace">按工作区</button>
          <button data-view="date">按日期</button>
          <button data-view="flat">单列表</button>
          <div class="wm-title">排序方式</div>
          <button data-order="manual">手动排序</button>
          <button data-order="updated">最近更新</button>
        </div>
        <!-- Workspace create/rename dialog. It collects the server-side
             directory path instead of using a browser upload control. -->
        <div id="ws-dialog" class="ws-dialog hidden">
          <div class="ws-dialog-card" role="dialog" aria-modal="true">
            <div class="ws-dialog-title" id="ws-dialog-title">新建工作区</div>
            <input id="ws-dialog-input" type="text" placeholder="工作区名称" maxlength="60" autocomplete="off">
            <input id="ws-dialog-path" type="text" placeholder="目录路径（例如 D:\\work\\project）" autocomplete="off">
            <button id="ws-dialog-pick" class="btn-ghost" type="button">选择目录…</button>
            <div class="ws-dialog-actions">
              <button id="ws-dialog-cancel" class="btn-ghost" type="button">取消</button>
              <button id="ws-dialog-ok" class="sec-btn primary" type="button">创建</button>
            </div>
          </div>
        </div>
        <!-- dsh directory-browser flow: the server owns absolute paths and
             the browser only renders the current level and breadcrumbs. -->
        <div id="ws-dir-dialog" class="ws-dialog hidden">
          <div class="ws-dialog-card ws-dir-card" role="dialog" aria-modal="true" aria-labelledby="ws-dir-title">
            <div class="ws-dialog-title" id="ws-dir-title">选择工作区目录</div>
            <div class="ws-dir-path-row">
              <input id="ws-dir-path" type="text" autocomplete="off" spellcheck="false" aria-label="目录路径">
              <button id="ws-dir-go" class="btn-ghost" type="button">前往</button>
            </div>
            <div id="ws-dir-crumbs" class="ws-dir-crumbs" aria-label="目录层级"></div>
            <div id="ws-dir-list" class="ws-dir-list" role="listbox" aria-label="子目录"></div>
            <p id="ws-dir-error" class="ws-dir-error hidden" role="alert"></p>
            <div class="ws-dialog-actions">
              <button id="ws-dir-cancel" class="btn-ghost" type="button">取消</button>
              <button id="ws-dir-new" class="btn-ghost" type="button">新建文件夹</button>
              <button id="ws-dir-ok" class="sec-btn primary" type="button">选择此目录</button>
            </div>
          </div>
        </div>
        <div id="ws-dir-new-dialog" class="ws-dialog hidden">
          <div class="ws-dialog-card" role="dialog" aria-modal="true" aria-labelledby="ws-dir-new-title">
            <div class="ws-dialog-title" id="ws-dir-new-title">新建文件夹</div>
            <input id="ws-dir-new-input" type="text" maxlength="120" placeholder="文件夹名称" autocomplete="off">
            <p id="ws-dir-new-error" class="ws-dir-error hidden" role="alert"></p>
            <div class="ws-dialog-actions">
              <button id="ws-dir-new-cancel" class="btn-ghost" type="button">取消</button>
              <button id="ws-dir-new-ok" class="sec-btn primary" type="button">创建</button>
            </div>
          </div>
        </div>
        <!-- Session rename dialog (dsh browser-owned Modal): pins the title. -->
        <div id="sr-dialog" class="ws-dialog hidden">
          <div class="ws-dialog-card" role="dialog" aria-modal="true">
            <div class="ws-dialog-title" id="sr-dialog-title">重命名会话</div>
            <input id="sr-dialog-input" type="text" placeholder="会话名称" maxlength="80" autocomplete="off">
            <div class="ws-dialog-actions">
              <button id="sr-dialog-cancel" class="btn-ghost" type="button">取消</button>
              <button id="sr-dialog-ok" class="sec-btn primary" type="button">保存</button>
            </div>
          </div>
        </div>

        <ul id="session-list" class="session-list"></ul>
        <!-- Sidebar foot (dsh footArea): the settings entry only. The runs
             panel moved to a session-header popover trigger (dsh aligns
             subagents + jobs as conversation.session.header.actions popovers). -->
        <nav class="sidebar-foot">
          <div class="foot-settings">
            <a href="#/settings" class="foot-action" title="设置"><span class="foot-ico" data-icon="settings" aria-hidden="true"></span><span class="foot-label">设置</span></a>
          </div>
        </nav>
      </section>

      <!-- Center column: topbar + message stream + composer. The whole header
           is hidden while the session is blank (dsh headerHidden: no status row
           on 新会话; only a session with content shows it). dsh
           ConversationSessionHeader structure: title row = [crumbs + header
           actions] on the left, header utilities on the right. -->
      <main class="col-center" aria-label="对话" data-phase="">
        <header id="topbar" class="topbar">
          <div class="title-row">
            <div class="title-cluster">
              <nav class="crumbs" aria-label="会话层级">
                <!-- Single crumb: shutu sessions carry no parent chain metadata
                     (dsh ancestry), so the current session is always the last
                     (crumb-current) segment. -->
                <span id="cur-session" class="crumb crumb-current" title="当前会话"></span>
              </nav>
              <!-- dsh AgentPresetLabel: read-only mode badge beside the title. -->
              <span id="mode-badge" class="preset-label hidden" title="会话模式：改 config.yaml 重启生效"></span>
              <!-- dsh conversation.session.header.actions: subagent catalog +
                   background jobs, each a count trigger with its own menu;
                   hidden until the session actually has entries. -->
              <div class="header-actions">
                <div id="subs-root" class="hd-root">
                  <button id="subs-trigger" class="hd-action hidden" type="button" aria-haspopup="menu" aria-expanded="false" title="子代理">
                    <span class="hd-slot" aria-hidden="true"><span class="hd-dot" data-state="idle"></span></span>
                    <span id="subs-count" class="hd-count">0 个子代理</span>
                    <span class="hd-caret" data-icon="caretdown" aria-hidden="true"></span>
                  </button>
                  <div id="subs-menu" class="hd-menu hidden" role="menu" aria-label="子代理"></div>
                </div>
                <div id="jobs-root" class="hd-root">
                  <button id="jobs-trigger" class="hd-action hidden" type="button" aria-haspopup="menu" aria-expanded="false" title="后台任务">
                    <span class="hd-slot" aria-hidden="true"><span class="hd-dot" data-state="idle"></span></span>
                    <span id="jobs-count" class="hd-count">0 个后台任务</span>
                    <span class="hd-caret" data-icon="caretdown" aria-hidden="true"></span>
                  </button>
                  <div id="jobs-menu" class="hd-menu hidden" role="menu" aria-label="后台任务"></div>
                </div>
              </div>
            </div>
            <!-- dsh conversation.session.header.utilities: right-edge controls
                 (shutu: settings page + theme toggle). -->
            <div class="header-utilities">
              <a id="settings-link" class="btn-icon" href="#/settings" title="设置">⚙</a>
              <button id="theme-toggle" class="btn-icon" title="切换主题">☀️</button>
            </div>
          </div>
        </header>
        <!-- The milieu is the centered/docked stage: in the hero phase it centers
             the headline + workspace/mode row + composer together (dsh
             ConversationRoot composerHero); in the active phase the transcript
             [#messages] scrolls and the composer docks at the bottom. One
             phase attribute on the column drives both postures. -->
        <div class="milieu">
          <div id="messages" class="messages" aria-live="polite"></div>
          <!-- Turn-level running indicator (dsh TurnStatus): a FIXED sibling of
               the scrolling transcript, docked above the input panel's left edge
               — it never scrolls away with the messages. -->
          <div id="turn-status" class="turn-status hidden" aria-live="polite"></div>
          <!-- Empty-state hero (dsh ConversationRoot HeroShell: fish logo →
               headline → preview badge → workspace chip row). -->
          <div id="hero" class="hero hidden">
            <div class="hero-inner">
              <div class="hero-headline">
                <!-- The brand mark is the sidebar logo PNG (black on light,
                     white on dark, swapped in applyTheme — same as brand-logo). -->
                <img id="hero-logo" class="hero-logo" alt="" width="32" height="32" src="/static/big_logo_1.png">
                <h1 class="hero-title">稳行数据荒漠</h1>
                <span class="hero-preview">预览版</span>
              </div>
              <div class="hero-ws-row">
                <button id="hero-ws-chip" class="ws-chip" type="button" aria-haspopup="menu" aria-expanded="false"
                        title="选择工作区">
                  <span class="ws-chip-ico" data-icon="folderclose16" aria-hidden="true"></span>
                  <span id="hero-ws-label" class="ws-chip-label">选择工作区</span>
                  <span class="ws-chip-caret" data-icon="caretdown" aria-hidden="true"></span>
                </button>
                <div id="hero-ws-menu" class="ws-menu hidden" role="menu"></div>
                <button id="hero-mode-chip" class="ws-chip" type="button" aria-haspopup="menu" aria-expanded="false"
                        title="选择模式">
                  <span class="ws-chip-ico" data-icon="caps" aria-hidden="true"></span>
                  <span id="hero-mode-label" class="ws-chip-label">标准模式</span>
                  <span class="ws-chip-caret" data-icon="caretdown" aria-hidden="true"></span>
                </button>
                <div id="hero-mode-menu" class="ws-menu hidden" role="menu"></div>
              </div>
            </div>
            <div class="hero-glow" aria-hidden="true"></div>
          </div>
          <!-- Composer card (dsh InputBar): a single rounded capsule holding the
               draft textarea on top and an action row below — command(＋) /
               permission on the left, model seat + submit on the right. A direct
               child of the milieu so one element is centered in the hero phase
               (below the headline/workspace row) and docked at the bottom in the
               active phase — the column's data-phase drives both postures. -->
          <div id="queue-root" class="queue-root hidden" aria-live="polite"></div>
          <div id="deliverables-root" class="deliverables-root hidden" aria-live="polite"></div>
          <div id="approval-root" class="approval-root hidden" aria-live="polite"></div>
          <div id="goal-bar" class="goal-bar hidden" aria-live="polite"></div>
          <div id="session-state" class="session-state hidden" aria-live="polite"></div>
          <div class="composer-card">
            <div id="composer" class="composer">
              <div class="grow-wrap">
                <textarea id="composer-text" rows="1" placeholder="给智能体发消息…"></textarea>
                <div class="mirror" aria-hidden="true"></div>
              </div>
              <div id="slash-menu" class="ws-menu slash-menu hidden" role="listbox" aria-label="Slash commands"></div>
              <div id="reference-menu" class="ws-menu reference-menu hidden" role="listbox" aria-label="文件引用"></div>
              <div class="composer-tools">
                <div class="ct-left">
                  <button id="cmd-btn" class="tool-btn" type="button" title="命令" aria-haspopup="menu" aria-expanded="false">
                    <span class="tool-ico" data-icon="plus" aria-hidden="true"></span>
                  </button>
                  <div id="cmd-menu" class="ws-menu hidden" role="menu"></div>
                  <button id="perm-seat" class="perm-seat" type="button" aria-haspopup="menu" aria-expanded="false" title="权限">
                    <span id="perm-seat-icon" class="perm-seat-icon" aria-hidden="true"></span>
                    <span id="perm-seat-label" class="ps-label">标准</span>
                    <span class="ps-caret" data-icon="caretdown" aria-hidden="true"></span>
                  </button>
                  <div id="perm-menu" class="ws-menu perm-menu hidden" role="menu"></div>
                  <button id="plan-seat" class="plan-seat" type="button" aria-pressed="false" title="计划模式">
                    <span class="plan-seat-icon" aria-hidden="true">☷</span>
                    <span id="plan-seat-label">计划</span>
                  </button>
                </div>
                <div class="ct-right">
                  <button id="model-seat" class="model-seat" type="button" aria-haspopup="menu" aria-expanded="false" title="选择模型">
                    <span id="model-seat-label" class="ms-label">模型</span>
                    <span class="ms-caret" data-icon="caretdown" aria-hidden="true"></span>
                  </button>
                  <div id="model-menu" class="ws-menu model-menu hidden" role="menu" aria-label="模型与推理等级"></div>
                  <span id="context-meter" class="context-meter"></span>
                  <button id="composer-send" class="send-btn" title="发送" aria-label="发送">➤</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button id="scroll-bottom" class="scroll-bottom hidden" title="回到底部">↓</button>
      </main>

      <!-- Details column: reserved for the tool-call details panel (P1 keeps 0
           width; data not ready → stays mounted but invisible). -->
      <!-- Details column (dsh ui-conversation DetailsPanel): a session / tool-call
           detail pane. The panel is mounted and shown when opened; the column
           stays at 0 width while collapsed (data-details-collapsed). -->
      <section class="col-details" aria-label="详情">
        <div id="details-panel" class="details-panel hidden">
          <header class="details-header">
            <span id="details-title" class="details-title">详情</span>
            <button id="details-close" class="details-close" title="关闭详情" type="button" aria-label="关闭详情">✕</button>
          </header>
          <div class="details-body">
            <div id="details-empty" class="details-empty">点击消息流中的工具行查看详情</div>
            <div id="details-selection" class="details-selection hidden"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Settings page (P3, dsh SettingsRoot): a centered two-column panel —
       188px nav rail + content column — under the existing #/settings route.
       Read-only config view (ADR D-WEB2-D): no runtime editing. -->
  <div id="settings" class="settings-page hidden">
    <header class="settings-top">
      <button id="settings-back" class="btn-ghost">← 返回聊天</button>
      <span class="spacer"></span>
      <button id="theme-toggle-settings" class="btn-icon" title="切换主题">☀️</button>
    </header>
    <div class="settings-body">
      <div class="settings-panel">
        <nav class="settings-nav" aria-label="设置">
          <div class="nav-title">设置</div>
          <div class="nav-list" id="settings-nav"></div>
        </nav>
        <div class="settings-content">
          <header class="settings-header">
            <div class="settings-head-actions">
              <span id="settings-sec-title" class="settings-sec-title">通用设置</span>
            </div>
            <button id="settings-close" class="btn-icon" title="关闭">✕</button>
          </header>
          <div class="settings-options">
            <div id="settings-loading" class="muted">加载中…</div>
            <div id="settings-error" class="err hidden"></div>
            <div id="settings-sec" class="settings-section"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Removed capability placeholder page. <!--
  <div id="placeholder" class="placeholder-page hidden">
    <button id="back" class="btn-ghost">← 返回聊天</button>
    <h1 id="ph-title"></h1>
    <p id="ph-note" class="muted"></p>
  </div> -->

  <script src="/static/icons.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
