# Personal Agent runtime configuration.
# All values shown are the defaults; an omitted field uses its default.
# API keys are NEVER stored here — they only come from environment variables.

# Chat model to use.
model: deepseek-v4-flash

# Optional OpenAI-compatible base URL. Empty means the provider default
# (https://api.deepseek.com).
base_url: ""

# Session workspace fallback. Ungrouped sessions and legacy title-only
# workspaces use this directory; empty creates and uses ~/shudu.
workspace:
  default_dir: ""

# Agent 模式预设 (ADR 2026-08-20-mode-presets.md): standard (标准, 默认: 全部
# 能力按各自 enabled 开关) | minimal (极简: 固定 persona + 持久 shell + 文件
# 编辑, 其余能力忽略) | code (PTC: 标准全部 + 程序化操作 Code Mode 段, 用
# code_run 组合多步). 重启生效; 未知值启动报错.
mode: standard

# LLM provider selection (M8-2, design.md §6 / ADR 2026-08-20-m8-message-model.md).
# The top-level model/base_url above remain the DeepSeek default configuration
# (compatible with existing config.yaml — not migrated). API keys NEVER appear
# here: they only come from environment variables — DEEPSEEK_API_KEY for the
# deepseek provider, OPENAI_API_KEY for the openai provider (纪律 6).
llm:
  # Provider selection route: deepseek-official (default) | openai | anthropic (M8-2b).
  # An unknown value fails closed at startup (no silent fallback).
  provider: deepseek-official
  # Per-provider parameters. A non-selected provider's parameters still parse
  # to their defaults, so the config can switch providers; credentials only
  # ever come from the environment.
  openai:
    # OpenAI-compatible base URL; empty defaults to https://api.openai.com/v1.
    base_url: https://api.openai.com/v1
    # Chat model; empty defaults to gpt-4o-mini.
    model: gpt-4o-mini
    # API key: OPENAI_API_KEY environment variable only (纪律 6).
  anthropic:
    # Anthropic Messages API base URL (M8-2b); "/messages" is appended.
    base_url: https://api.anthropic.com/v1
    # Chat model (M8-2b).
    model: claude-sonnet-4-5
  # Shared request-level retry policy. Retries happen before stream data starts;
  # a partially received stream is never replayed. 429/network/5xx are retryable;
  # other 4xx errors fail closed.
  retry:
    max_retries: 2
    initial_backoff: 500ms
    max_backoff: 8s
    # API key: ANTHROPIC_API_KEY environment variable only (M8-2b, 纪律 6).
  # Exact-model input-modality capability declaration (M8-3, dispatch-m8-3 §3):
  # "text" | "text,image". /llm-status shows it as the modalities line. This is
  # the model's declared capability — when it lacks "image", image blocks must
  # fail closed rather than be silently dropped (M8-3b enforces at serialize
  # time).
  model_input_modalities: text
  # Image-attachment policy (M8-3, ADR 2026-08-20-m8-message-model.md 决策 M8-3).
  # Default OFF (D10): when disabled the /attach command is unavailable and
  # image blocks are never serialized. When enabled, /attach stores the image
  # file under <data_dir>/attachments/ and the session log only ever carries
  # the ImageRef reference (dsh 7078918 范式: 落库只存引用，请求时才转 data URL) —
  # the image bytes never enter the log or this config.
  multimodal:
    # Master switch. false ⇒ no attachment store is created and /attach
    # reports "multimodal disabled" (默认关闭 D10，不初始化).
    enabled: true
    # Single-image raw-byte cap applied by /attach (fail-closed over-limit);
    # 0/absent ⇒ 10485760 (10 MiB).
    max_image_bytes: 10485760
    # Request-level image total budget (M8-3b): images whose cumulative bytes
    # (in message-history order) exceed it are replaced with the placeholder
    # text, oldest first; 0/absent ⇒ 20971520 (20 MiB).
    max_request_image_bytes: 20971520

# Directory for runtime data (the session database pa.db lives here).
data_dir: data

# Directory of prompt section files (see config/prompts/README.md).
prompts_dir: config/prompts

# Tool execution policy (M3, design.md §5 / ADR 2026-08-18-m3-sandbox-scope).
# API keys never appear here — they only come from environment variables.
tools:
  # Whitelist: only these tool names may execute (未启用 ⇒ 拒绝执行).
  # Defaults to the read-only pair when absent.
  enabled:
    - get_time
    - read
  # Per-tool execute deadline wrapped around every Execute (Go duration).
  # run_command may override it via tools.run_command.timeout.
  timeout: 30s
  # Tool output over this many bytes is truncated; the full text is spilled to
  # <data_dir>/spill/<session>-<seq>.txt and the locator is returned to the
  # model (and logged into tool/result).
  output_limit: 65536
  # The sole execution-class tool (design.md §5 / D10). Off by default; only
  # when enabled: true is it registered and usable. Commands run as a single
  # line through cmd /C (Windows) or /bin/sh -c (elsewhere) in a fixed
  # working directory, with credential-shaped environment entries scrubbed.
  run_command:
    enabled: false
    # Optional per-tool timeout override; empty uses tools.timeout.
    # timeout: 60s
    # Fixed working directory; empty = the agent's process working directory.
    # workdir: ""
# Background-job capability (M5a; design.md §10 D5 / ADR 2026-08-18-m5-agent-core.md
# 决策 ①). Off by default (D10): when disabled no registry is initialized and no
# job_* tool is registered or whitelisted. job_start runs a command line as a
# background job (os/exec + context cancellation); job_status / job_read observe
# it, job_cancel cancels it, job_wait awaits it (bounded, default 30s). Job
# state/output reach the model through the tools' tool/result; job/start,
# job/status and job/done are logged as facts (D3). Jobs are in-memory only —
# a process restart clears them (no persistence in M5a).
jobs:
  # Master switch. false ⇒ no jobs.Local is created and the job_* tools are
  # neither registered nor whitelisted (默认关闭，不初始化).
  enabled: true
  # Cap on running+stopping jobs in one owner bucket (and the shared unowned
  # bucket); 0/absent ⇒ 10.
  max_concurrent_jobs_per_owner: 10

# Subagent capability (M5b; design.md §10 D2 / ADR 2026-08-18-m5-agent-core.md
# 决策 ②). Off by default (D10): when disabled no Runtime/SpawnProvider is
# initialized and no subagent_* tool is registered or whitelisted.
# subagent_spawn delegates a task to a brand-new child agent (independent
# session + independent loop, run in the background); subagent_status observes
# it (running, or the terminal result once settled), subagent_cancel cancels
# it, subagent_list enumerates a session's children. Child state/output reach
# the model through the tools' tool/result; subagent/start, subagent/end and
# subagent/report are logged as facts (D3). Children are in-memory only — a
# process restart clears them (no continuation in M5b).
subagent:
  # Master switch. false ⇒ no subagent runtime is created and the subagent_*
  # tools are neither registered nor whitelisted (默认关闭，不初始化).
  enabled: true
  # Default delegation depth cap applied by subagent_spawn when max_depth is
  # omitted; 0/absent ⇒ 8.
  max_depth: 8
  # Provider subagent_spawn delegates to. "spawn" (the in-process provider) is
  # the only one shipped in M5b; empty/absent ⇒ "spawn".
  default_provider: spawn
  # 外部子代理后端 (可选, 默认关 D10): codex → `codex exec --json`,
  # claude_code → `claude -p`. command 缺省即同名命令. CLI 不存在时
  # subagent_spawn provider=codex 报错 (fail-closed, 不回退本地).
  external_providers:
    codex:
      enabled: false
      command: codex
    claude_code:
      enabled: false
      command: claude

# Context-compaction capability (M5c; ADR 2026-08-18-m5-agent-core.md
# 决策 ③). Off by default (D10): when disabled the automatic pre-step trigger
# is not registered and the /compact command reports the capability as
# unavailable. Compaction has no consumer tools — enabling it whitelists
# nothing: automatic triggering runs through the loop pre-step injector
# (pressure over token_threshold), manual compaction through the /compact
# command. A compaction summarizes a surface range into a user/message that
# shadows the old range in the derived history (the append-only log is
# unchanged, D1); compaction/start, compaction/summary, compaction/end and
# compaction/prune are logged as facts (D3).
compaction:
  # Master switch. false ⇒ no compaction engine is wired into the pre-step
  # injector and the /compact command is unavailable (默认关闭，不初始化).
  enabled: true
  # Surface-token pressure threshold above which a step auto-compacts;
  # 0/absent ⇒ 32000.
  token_threshold: 32000
  # Tail of recent turns kept unshadowed by the basic provider; 0/absent ⇒ 8.
  retain_turns: 8
  # dsh-style token tail budget. When positive it takes precedence over
  # retain_turns; 0 keeps the legacy turn-based fallback.
  retain_tokens: 0
  # Upper bound on the generated summary; 0/absent ⇒ the engine default.
  max_chars: 0

# Skill capability (M5d; design.md §3 / ADR 2026-08-18-m5-agent-core.md
# 决策 ④). Off by default (D10): when disabled no skill provider/registry is
# initialized, skill is neither registered nor whitelisted, and no skill
# catalog pre-step injector is wired. Skills are trusted local files loaded as
# model instruction text — never executed. When enabled, each turn's first
# request carries the skill catalog (sorted name + description, bounded) and
# skill loads a skill's full body (bounded) on demand; skill/catalog and
# skill/load are logged as facts (D3).
skill:
  # Master switch. false means no skill provider/registry is created and skill
  # is neither registered nor whitelisted.
  enabled: true
  # Additional custom skill directories (source "custom", rank 300), scanned in
  # order. Empty by default.
  dirs: []
  # Bound on the injected skill catalog (name + description), in chars;
  # 0/absent ⇒ 500.
  catalog_max_chars: 500
  # Bound on the skill body skill returns to the model, in chars
  # (Unicode-safe truncation, 防超长注入); 0/absent ⇒ 8000.
  body_max_chars: 8000

# Schedule capability (M6a; design.md §10 D2 / ADR 2026-08-19-m6-agent-full.md
# 决策 M6a). Off by default (D10): when disabled no Provider/Engine is
# initialized, no schedule_* tool is registered or whitelisted, and no
# schedule pre-step injector is wired. When enabled, schedule_create /
# schedule_list / schedule_delete manage recurring interval and cron triggers
# (in-memory only, cleared on restart), and each turn's serial pre-step path
# advances the schedule clock — a due trigger logs a schedule/fire fact (D3)
# and, when jobs is enabled, enqueues a background job executing the trigger's
# payload (D5: no background ticker; every side effect happens on the serial
# pre-step path). schedule/create, schedule/list, schedule/delete and
# schedule/fire are logged as facts (D3).
schedule:
  # Master switch. false ⇒ no schedule Provider/Engine is created and the
  # schedule_* tools are neither registered nor whitelisted (默认关闭，不初始化).
  enabled: true
  # Cadence of the serial schedule-clock advancement (per-turn pre-step
  # Engine.Tick). M6a-2 has no background ticker (D5); 0/absent ⇒ 1m.
  tick_interval: 1m

# Task-planning capability (M6b; design.md §10 D2 / ADR 2026-08-19-m6-agent-full.md
# 决策 M6b). Off by default (D10): when disabled no Provider/Engine is
# initialized and no plan_* tool is registered or whitelisted. When enabled,
# plan_goal / plan_plan / plan_todo build a goal → plan → todo tree bottom-up,
# plan_status advances or blocks one record, plan_list returns the aggregation
# tree, and plan_remove deletes a goal (cascading to its plans), a plan or a
# todo. The model observes the tree through the tools' tool/result; plan/create,
# plan/status, plan/delete and plan/list are logged as facts (D3). The tree is
# in-memory only — a process restart clears it (no persistence in M6b).
plan:
  # Master switch. false ⇒ no plan Provider/Engine is created and the plan_*
  # tools are neither registered nor whitelisted (默认关闭，不初始化).
  enabled: true

# Long-term-memory capability (M6c; design.md §10 D2 / ADR 2026-08-19-m6-agent-full.md
# 决策 M6c). Off by default (D10): when disabled no Provider/Engine is
# initialized, no spill_* tool is registered or whitelisted, and no
# auto-sedimentation path is wired. When enabled, spill_write explicitly
  # stores a conversation-derived memory, spill_recall recalls by query,
  # spill_list enumerates memories, spill_delete removes one (persisted under
  # <data_dir>/memory.json), and — when auto_spill is on — every completed turn's
# event log is folded into new memories on the serial path (D5). Memories are
# logged as facts: spill/write, spill/recall, spill/list and spill/delete (D3).
spill:
  # Master switch. false ⇒ no spill Provider/Engine is created, the spill_*
  # tools are neither registered nor whitelisted, and no auto-sedimentation
  # path is wired (默认关闭，不初始化).
  # Whether the end-of-turn auto-sedimentation runs (Engine.AutoSpill over the
  # session event log), folding memory-worthy fragments into new memos after
  # each completed turn. Only takes effect when spill is enabled; absent ⇒ true.
  auto_spill: true

# Human-approval capability (M6d; design.md §10 D2 / ADR 2026-08-19-m6-agent-full.md
# 决策 M6d). Off by default (D10): when disabled no Provider/Engine is
# initialized, no interact_* tool is registered or whitelisted, and no
# sensitive-tool gate is installed. When enabled, interact_ask raises a
# question/approval request for the user (the CLI interaction happens on the
# user's terminal; the model continues) and interact_status looks up a request's
# current status (in-memory only, cleared on restart). When sensitive_tools is
# non-empty, every requested execution of a listed tool first passes a human
# approval on the CLI serial path (y/n) — approved lets the tool run, rejected
# returns a denial to the model. interact/request, interact/resolve,
# interact/deny and interact/status are logged as facts (D3).
interact:
  # Master switch. false ⇒ no interact Provider/Engine is created, the
  # interact_* tools are neither registered nor whitelisted, and no
  # sensitive-tool gate is installed (默认关闭，不初始化).
  enabled: true
  # Tools whose execution must first pass a human approval (e.g. run_command).
  # Empty ⇒ no gating; an enabled interact still registers the interact_* tools
  # but intercepts nothing.
  sensitive_tools: []

# Code-sandbox capability (M6e; design.md §10 D2 / ADR 2026-08-19-m6-agent-full.md
# 决策 M6e / dispatch-m6e-2). Off by default (D10): when disabled no local
# Provider/Engine is initialized and code_run is neither registered nor
# whitelisted. When enabled, code_run executes a shell script ("sh") in a
# controlled local subprocess sandbox: a separate child process, a hard-kill
# timeout, a per-stream output quota with truncation markers, and an isolated
# sandbox working directory — default no network credentials injected (the
# child's environment is scrubbed of credential-shaped entries). This is
# controlled isolation, not strong isolation: on Windows there is no network
# namespace, so denying network at the OS level is out of scope. The run
# outcome (exit code / output / timeout / truncation) is returned to the model
# and code/run is logged as a fact (D3). The tool is a sandboxed sibling of M3's
# run_command: it keeps run_command available and adds the sandbox semantics
# (timeout + quota + sandbox cwd) on top.
code:
  # Master switch. false ⇒ no local Provider/Engine is created and code_run is
  # neither registered nor whitelisted (默认关闭，不初始化).
  enabled: true
  # Sandbox execution deadline (Go duration) applied when the model omits the
  # per-call timeout, and the outer per-tool deadline bound for code_run
  # (mirrors tools.run_command.timeout); 0/absent ⇒ 30s. Keep it ≤ tools.timeout
  # or raise tools.timeout if you want sandbox runs to outlive the generic
  # per-tool deadline.
  timeout: 30s
  # Per-stream output cap of a sandbox run in bytes (the model cannot override
  # it); 0/absent ⇒ 65536 (64KiB).
  max_output: 65536
  # Sandbox working directory used when the model omits cwd. Empty ⇒ the
  # provider default <project>/.sandbox (created on demand).
  # sandbox_dir: ""
  # Declarative network toggle: false (default) ⇒ the sandbox injects no
  # network credentials (the local provider always scrubs credential-shaped
  # environment entries regardless). Recorded boundary, not strong isolation.
  allow_network: false

# MCP tool-ecosystem capability (M6f; design.md §10 D2 / ADR
# 2026-08-19-m6-agent-full.md 决策 M6f). Off by default (D10): when disabled no
# mcp Factory is created, the mcp_* tools are neither registered nor
# whitelisted, and no server is bridged. When enabled, mcp_list lists a
# configured server's tools and mcp_call invokes one by name (each a fresh
# stdio client per call), and every tool each configured server advertises is
# bridged into the tool registry as mcp.<server>.<tool> with its input schema
# passed through, calling back into the server via tools/call. mcp/list and
# mcp/call are logged as facts (D3). The client is self-implemented JSON-RPC 2.0
# over stdio (zero new dependencies, ADR 决策 M6f) — no MCP SDK.
mcp:
  # Master switch. false ⇒ no mcp Factory is created, the mcp_* tools are
  # neither registered nor whitelisted, and no server is bridged
  # (默认关闭，不初始化).
  enabled: true
  # Configured MCP servers (stdio, newline-delimited JSON-RPC). Each server's
  # tools are bridged at startup under the mcp.<server>.<tool> prefix. Empty by
  # default; enabling mcp with no servers still registers the mcp_* tools.
  servers: []
  # servers:
  #   - name: filesystem
  #     cmd: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

# Safe-file-operation capability (M6f; design.md §10 D2 / ADR
# 2026-08-19-m6-agent-full.md 决策 M6f). Off by default (D10): when disabled no
# FileService is created and no fs_* tool is registered or whitelisted. When
# enabled, fs_read reads a file (capped at 1MiB to keep large files from
# blowing the model context), fs_write creates or overwrites a file (creating
# missing parent directories), and fs_list lists a directory's direct children
# (non-recursive). Every fs_* path is constrained to the allowed root — a
# path that escapes it (a ".." escape) is rejected before any file is touched.
# fs/read, fs/write and fs/list are logged as facts (D3). The tools run on the
# serial tool path (D5).
fs:
  # Master switch. false ⇒ no FileService is created and the fs_* tools are
  # neither registered nor whitelisted (默认关闭，不初始化).
  enabled: true
  # Allowed root every fs_* path must stay inside. Empty ⇒ <project> (the
  # process working directory). An absolute or relative directory path is
  # resolved to its absolute form at startup.
  root: ""

# File-content-search capability (D-GAP-1; ADR 2026-08-20-standard-gaps.md
# D-GAP-1 / 2026-08-23-fs-search-dsh-alignment.md). Off by default (D10): when
# disabled the composition root registers no grep/glob tool and whitelists
# nothing (默认关闭，不初始化). When enabled, grep searches file contents with a
# REGULAR EXPRESSION (dsh grep: pattern/path/include, case-sensitive, results
# grouped by file, first 250 matches inline) and glob lists file paths
# matching a path glob (dsh glob: no "/" in the pattern matches basenames at
# any depth, sorted by modification time, first 100 paths inline) — both
# read-only, bounded capabilities: VCS/dependency directories (.git,
# node_modules, ...) and binary files are skipped, files over 1 MiB are
# skipped, and the scan is capped. The tools run on the serial tool path (D5).
fs_search:
  # Master switch. false ⇒ no fs_search tool is registered and nothing is
  # whitelisted (默认关闭 D10，不初始化).
  enabled: true

# Web search/fetch capability (M7; design.md §10 D2 / ADR
# 2026-08-20-m7-web-search.md / dispatch-m7-2). Off by default (D10): when
# disabled the composition root creates no Engine, registers no web_* tool and
# whitelists nothing (默认关闭，不初始化). When enabled, web_search runs one or
# more DeepSeek-native searches (the API key comes from the DEEPSEEK_API_KEY
# environment variable only — never from this file) and web_fetch retrieves a
# specific HTTP(S) URL (following only same-origin redirects, no cookies or
# ambient credentials). web.enabled is the single switch for both search and
# fetch — there is no separate search_enabled/fetch_enabled switch
# (dispatch-m7-2 §6: 按 dsh {search:true, fetch:true} 语义简化为总开关). Search
# requests are logged as web/search-request facts (D3) by the provider's
# OnRequest; tool results go through tool/result. Both tools execute on the
# serial tool path (D5).
web:
  # Master switch. false ⇒ no Engine/provider is created and the web_* tools
  # are neither registered nor whitelisted (默认关闭 D10，不初始化).
  enabled: true
  # Source cap for a single search and for the merged multi-query result;
  # 0/absent ⇒ 8.
  search_max_results: 8
  # Query-count cap for one web_search call (schema maxItems); 0/absent ⇒ 4.
  search_max_queries: 4
  # Outer budget for one web_search call in ms (all queries share it);
  # 0/absent ⇒ 30000.
  search_timeout_ms: 30000
  # Outer budget for one web_fetch call in ms; 0/absent ⇒ 30000.
  fetch_timeout_ms: 30000
  # Cap on the model-facing web_fetch body in chars (truncated with a
  # "[truncated: showing first N chars]" notice); 0/absent ⇒ 200000.
  fetch_max_output_chars: 200000
  # Cap on the fetched response body in bytes; 0/absent ⇒ 2097152 (2 MiB).
  fetch_max_response_bytes: 2097152
  # Cap on the request URL length; 0/absent ⇒ 2048.
  fetch_max_url_bytes: 2048
  # Cap on same-origin redirect hops; 0/absent ⇒ 5.
  fetch_max_redirects: 5
  # User-Agent header for web_fetch; empty/absent ⇒ "shutu-agent/0.1 (M7)".
  fetch_user_agent: shutu-agent/0.1 (M7)
  # DeepSeek search-provider parameters (M7-1). The API key is read from the
  # DEEPSEEK_API_KEY environment variable only; an absent key makes the search
  # provider unavailable (web_search returns a credential error).
  deepseek:
    # Anthropic-compatible Messages API base URL (/messages is appended).
    base_url: https://api.deepseek.com/anthropic/v1
    # Search request model.
    model: deepseek-v4-flash
    # anthropic-version header.
    api_version: 2023-06-01
    # Search request max_tokens; 0/absent ⇒ 4096.
    max_tokens: 4096
    # web_search server tool max_uses per request; 0/absent ⇒ 5.
    max_uses: 5

# terminal: gates the pwsh tool and the /term REPL (ADR
# 2026-08-23-pwsh-dsh-alignment.md). The model-facing pwsh tool follows dsh
# tool-pwsh: each call runs a FRESH `pwsh -NoLogo -NoProfile -NonInteractive
# -Command` process — no state (cwd/variables/functions) persists between
# calls, pass workdir instead of cd; non-zero exits are [exit code: N]
# markers, credential-shaped env entries are scrubbed, and
# run_in_background (jobs.enabled required) returns a job id. The /term REPL
# keeps the M9 persistent session (interactive use only). Default on (dsh
# 对齐 opt-out); when disabled: no pwsh tool, no /term. The session subprocess
# runs with a scrubbed environment (agent credentials are never inherited).
#   enabled: true            # master switch; false → no pwsh tool, no /term
#   shell: ""                # /term session shell: platform default (cmd.exe on Windows)
#   args: []
#   workdir: ""              # default pwsh workdir (session workspace); empty → agent cwd
#   scrollback_max_bytes: 65536
#   scrollback_lines: 2000
#   read_idle_ms: 500
#   read_timeout_ms: 30000
#   max_concurrent_sessions: 1

# eval: task-evaluation capability (M-Eval; design.md §10 D2 / ADR
# 2026-08-20-eval-seam.md D-EVAL-6). Off by default (D10): when disabled the
# composition root creates no eval Engine, registers no eval_* tool and
# whitelists nothing (默认关闭，不初始化). When enabled, eval_run judges a
# deliverable output text against acceptance criteria (rule → llm → manual
# dispatch, D-EVAL-3), eval_result reads one evaluation record, eval_list lists
# the evaluation history, and each completed evaluation lands as an eval/run
# log fact (D3). The engine-issued record ids follow the "eval-N" scheme.
eval:
  # Master switch. false ⇒ no eval Engine is created and the eval_* tools are
  # neither registered nor whitelisted.
  enabled: true
  # LLM-undecided (manual) verdict route: true (default) asks a human, false
  # fails closed. Absent ⇒ true; an explicit false is honored verbatim.
  manual_fallback: true
  # Evaluation-history cap (oldest records are evicted); 0/absent ⇒ 100.
  max_records: 100

# Fresh-agent loop capability (GAP-2; ADR 2026-08-20-standard-gaps.md D-GAP-3
# / docs/dispatch-gap-2.md). Off by default (D10): when disabled the composition
# root registers no ralph tool and whitelists nothing (默认关闭，不初始化). When
# enabled, ralph runs a bounded multi-round fresh-agent loop over an immutable
# objective: each round spawns a brand-new subagent (no session inheritance,
# only a bounded structured report crosses rounds) sharing the workspace on disk
# as long-term memory (D-GAP-3, aligned with dsh tool-ralph). A worker returns a
# strict continue/complete/blocked report; the final envelope reaches the model through the tool's
# tool/result, and ralph/run is logged as a fact (D3). The tool runs on the
# serial tool path (D5). Enabling ralph also requires subagent (the loop spawns
# children through the subagent Runtime).
ralph:
  # Master switch. false ⇒ no ralph tool is registered and nothing is
  # whitelisted (默认关 D10，不初始化).
  enabled: true

# Workflow orchestration: dsh-compatible JavaScript script is the dynamic path
# (meta/script/args, agent/parallel/pipeline/phase/log); tasks[] remains the
# Go-native DAG compatibility path. The capability defaults on (nil means on,
# explicit false opts out), and minimal mode disables it. Node.js is an external
# runtime; the Go binary itself has no Node dependency.
workflow:
  # Master switch. false ⇒ no workflow_run is registered or whitelisted.
  enabled: true
  # Ready-task concurrency cap (how many DAG tasks spawn in parallel within one
  # layer); 0/absent ⇒ 4.
  max_concurrent: 4
  # JavaScript runner backstops; 0/absent uses dsh-aligned defaults.
  max_total_agents: 1000
  max_items_per_call: 4096
  sync_timeout_ms: 5000

# Web 门户 (M10a, ADR 2026-08-20-m10-web-portal.md; 统一 webServer: dsh 式会话/
# 监听. token 必填且只在此配置出现明文, 进程内只存 SHA-256 摘要; 空 token 且
# enabled 时启动报错 (fail-closed 防裸奔). addr 默认本机 (个人门户不默认暴露).
web_server:
  enabled: true
  addr: 127.0.0.1:18099
  token: ""
  # React/Cordis frontend output from: cd web && npm.cmd run build
  dist_dir: web/dist
