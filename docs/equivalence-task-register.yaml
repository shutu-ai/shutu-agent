      - unsupported is exposed as a stable negative response, never a silently failing endpoint
    command: go test ./internal/profile ./internal/webserver -run 'Capability|Profile|Unsupported' -count=1
    evidence: internal/profile/classification.go; internal/profile/classification_test.go; internal/webserver/runtime_profile_test.go; docs/dsh-equivalence-progress.md
