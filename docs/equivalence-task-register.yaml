    acceptance:
      - manifest reference commit/tag is unchanged for the audit run
      - gate rejects claimAllowed=false
    command: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/equivalence-gate.ps1
    evidence: docs/equivalence-manifest.yaml; scripts/equivalence-gate.ps1; scripts/equivalence-report.ps1
    releaseBlocker: false

