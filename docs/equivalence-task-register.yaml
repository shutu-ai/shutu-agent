  - id: A3.3
    area: sandbox
    status: done
    priority: P1
    objective: Finish Code Mode worker isolation, resource budgets, timeout/kill-tree, quiescence, duplicate call admission, and cleanup.
    implementation: internal/code; internal/tools; internal/profile; cmd/pa/codes.go
    acceptance:
      - worker death and timeout produce one terminal receipt and no orphan process/file
      - external Node exec is explicitly classified as an architecture-equivalent process-isolation substitute with the same model-facing budgets and fail-closed ambient effects
    command: go test ./internal/code ./internal/tools ./internal/profile ./cmd/pa -run 'Code|Worker|Timeout|Kill|Quiescence|Duplicate|Permission|Sandbox' -count=1
    evidence: docs/dsh-equivalence-progress.md; internal/code/process_tree_windows.go; internal/code/process_tree_unix.go; internal/code/process_tree_limits.go; internal/code/process_tree_windows_test.go; internal/code/process_tree_unix_test.go; internal/code/typescript.go; internal/code/typescript_test.go; internal/code/typescript_lifecycle_matrix_test.go; internal/profile/classification.go
    notes: The TypeScript worker's Windows Job Object enforces per-process CPU, a 16-process concurrent ceiling, and kill-on-close; a real child proves the active-process limit admits exactly one descendant. A bounded four-level POSIX fork bomb proves owned process-group cleanup leaves no addressable descendant tree. The full internal/code matrix passed on Windows/Node 24.19.0 and AlmaLinux 8.10/Node 24.19.0: timeout, hostile oversized frame, worker death, heap/output quotas, CPU/wall budgets, forged duplicate call admission, queued-unstarted abandonment, cancellation, close join, empty environment, and no generated program file. A real ambient probe proves Node permission admission denies child-process and worker_threads effects on both platforms. Settlement now drains bounded host replies before OS shutdown: an in-flight call receives cancellation and a queued-unstarted call receives explicit abandonment without reaching the binding, while post-terminal done/call frames remain ignored. The DSH worker-thread transport is registered as an internal architecture exclusion; Shutu's external permission-model subprocess provides the same observable budgets with process-level isolation.
    dependencies: [A3.1, A3.2]
    releaseBlocker: true

