schemaVersion: 1
kind: shutu-dsh-equivalence-task-register
asOf: 2026-08-31
authority:
  summary: docs/dsh-equivalence-tasks.md
  manifest: docs/equivalence-manifest.yaml
  rule: An item is complete only when implementation, negative-path evidence, and the listed acceptance command all pass.
  releaseRule: No capability-equivalent claim is allowed while any required item is partial, open, blocked, or unverifiable.

statusVocabulary:
  done: implementation and acceptance evidence are present
  partial: a seam or local test exists, but the equivalence boundary is not proven
  open: implementation or required evidence is missing
  blocked: a required external capability is unavailable; the product must fail closed or remove that profile

